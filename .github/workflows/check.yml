# Compile and test without publishing anything.
#
# `build.yml` fires on a push to `main` and that push installs on the phone, so there is
# no review step between a mistake and the device. This workflow is the review step: push
# the branch, wait for it to go green, then push `main`. It runs the same unit tests and
# the same debug compile and stops short of signing, releasing or uploading.
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# Nothing here publishes, so nothing here needs to write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile
        run: ./gradlew :app:assembleDebug --stacktrace
